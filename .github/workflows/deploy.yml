name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'packages/**'
      - '.npmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'turbo.json'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-frontend:
    name: Deploy Frontend to Cloudflare Workers
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL || secrets.PUBLIC_API_URL || 'https://api.ourapix.jiahongw.com' }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://ourapix.jiahongw.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deploy configuration
        run: |
          if [ "${HAS_CLOUDFLARE_SECRETS}" != "true" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be configured"
            exit 1
          fi

          case "${PUBLIC_API_URL}" in
            ""|http://localhost*|https://localhost*)
              echo "::error::PUBLIC_API_URL must be a non-local production API URL"
              exit 1
              ;;
          esac

      - name: Lint frontend
        run: pnpm --filter @oura-pix/frontend lint

      - name: Type check
        run: pnpm --filter @oura-pix/frontend typecheck

      - name: Build frontend
        run: pnpm --filter @oura-pix/frontend build

      - name: Verify production API URL was bundled
        run: |
          if grep -R "http://localhost:8989" frontend/dist; then
            echo "::error::Frontend bundle contains the local API fallback"
            exit 1
          fi

      - name: Verify Cloudflare deploy bundle
        run: pnpm --filter @oura-pix/frontend exec wrangler deploy --dry-run

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: deploy

      - name: Smoke test frontend and API
        run: |
          curl -fsS --retry 3 --retry-delay 5 --retry-all-errors "${FRONTEND_URL}" >/dev/null
          curl -fsS --retry 3 --retry-delay 5 --retry-all-errors "${PUBLIC_API_URL%/}/health" >/dev/null
