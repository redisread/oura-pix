name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - refactor/gomate-style
    paths:
      - 'frontend/**'
      - 'packages/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'packages/**'

jobs:
  # ========== 前端构建与部署 ==========
  deploy-frontend:
    name: Deploy Frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build i18n
        run: pnpm --filter @oura-pix/frontend i18n:build || echo "i18n build skipped"

      - name: Type check
        run: pnpm --filter @oura-pix/frontend typecheck || echo "typecheck skipped"

      - name: Build frontend
        run: pnpm --filter @oura-pix/frontend build
        env:
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: oura-pix
          directory: frontend/dist
          branch: ${{ github.ref_name }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
