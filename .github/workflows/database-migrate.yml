name: Migrate Database

on:
  push:
    branches:
      - main
    paths:
      - 'drizzle/migrations/*.sql'
      - 'drizzle/migrations/meta/*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-database
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply D1 Migrations
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Cloudflare configuration
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be configured"
            exit 1
          fi

      - name: Type check database package
        run: pnpm --filter @oura-pix/database build

      - name: Apply production migrations
        run: pnpm db:migrate:prod
