name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'packages/**'
      - 'drizzle/**'
      - '.npmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'turbo.json'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-api:
    name: Deploy API to Cloudflare Workers
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      API_HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://api.ourapix.jiahongw.com/health' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deploy configuration
        run: |
          if [ "${HAS_CLOUDFLARE_SECRETS}" != "true" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be configured"
            exit 1
          fi

      - name: Lint
        run: pnpm --filter @oura-pix/api lint

      - name: Type check
        run: pnpm --filter @oura-pix/api typecheck

      - name: Test
        run: pnpm --filter @oura-pix/api test -- --run

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          command: deploy

      - name: Smoke test API
        run: curl -fsS --retry 3 --retry-delay 5 --retry-all-errors "${API_HEALTH_URL}" >/dev/null
