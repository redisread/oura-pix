# OuraPix Frontend — Cloudflare Workers
# Deploy: wrangler deploy (from frontend/ directory)

name = "oura-pix-frontend"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2026-02-26"
compatibility_flags = ["nodejs_compat"]

# Static assets served by Astro adapter
[assets]
directory = "dist"
binding = "ASSETS"

# Environment variables
[vars]
PUBLIC_API_URL = "https://api.ourapix.jiahongw.com"

# Observability
[observability]
enabled = true

[placement]
mode = "smart"
